[workspace]
resolver = "2"
members = [
    "ar_row",
    "ar_row_derive",
    "ar_row_readme",
]


[workspace.package]
version = "2.0.0"
authors = [
    "Software Heritage developers <swh-devel@inria.fr>"
]
rust-version = "1.85"
edition = "2021"
readme = "README.md"
homepage = "https://gitlab.softwareheritage.org/swh/devel/ar_row-rs"
repository = "https://gitlab.softwareheritage.org/swh/devel/ar_row-rs"
keywords = ["arrow", "proc-macros"]
categories = ["encoding", "parser-implementations"]

[workspace.dependencies]
ar_row = { version = "2.0.0", path = "ar_row/" }
ar_row_derive = { version = "2.0.0", path = "ar_row_derive/" }


[profile.release]
debug = 1
